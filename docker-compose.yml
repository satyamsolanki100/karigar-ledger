services:
  postgres:
    image: postgres:16-alpine
    container_name: karigar-ledger-db
    environment:
      POSTGRES_USER: karigar
      POSTGRES_PASSWORD: karigar
      POSTGRES_DB: karigar_ledger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
